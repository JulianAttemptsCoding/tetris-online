name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tetris-online .
      - run: docker run -d --name tetris -p 3300:3000 tetris-online
      - run: curl --fail --retry 10 --retry-delay 1 --retry-all-errors --max-time 5 http://localhost:3300/health
      - run: curl --fail http://localhost:3300/vendor/trystero.js -o /dev/null
      - if: failure()
        run: docker logs tetris
